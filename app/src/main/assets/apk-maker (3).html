return`<div class=c style="margin:0 0 10px"><b>🚀 بناء APK حقيقي</b><p class=m>يرفع المشروع إلى حسابك على GitHub ويبنيه هناك مجاناً ثم يعطيك رابط الـAPK. يحتاج Token بصلاحيتي repo وworkflow (<a href="https://github.com/settings/tokens/new?scopes=repo,workflow&description=apk-maker" target=_blank>أنشئه من هنا</a>). يعمل فقط من ملف HTML المحمّل، وليس من الصفحة المنشورة.</p><label>GitHub Token<input id=tk type=password value="${esc(localStorage.getItem('ghtk')||'')}"></label><label class=r><input type=checkbox id=pv2 checked>مستودع خاص</label><button class=b onclick=rb()>🚀 ابنِ APK الآن</button><div id=gs class=m></div></div><p class=m>سيتم إنشاء مشروع أندرويد كامل جاهز للبناء. ارفعه إلى GitHub (فيه ملف بناء تلقائي) أو افتحه في Android Studio.</p><button class=b onclick=bz()>📦 تصدير مشروع أندرويد (ZIP)</button><br><button class="b g" onclick=bj()>💾 تصدير الإعدادات (JSON)</button><br><button class="b g" onclick=pv()>👁️ معاينة التطبيق</button><br><button class="b g" onclick=home()>🏠 الرئيسية</button><p class=m>ملاحظة: يُبنى APK موقّع بمفتاح debug عبر GitHub Actions. التوقيع للنشر في Play يتم لاحقاً بمفتاحك.</p>`}
